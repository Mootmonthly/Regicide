name: tests

on:
  push:
  pull_request:

jobs:
  godot:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
      - name: Import project
        run: godot --headless --path . --import
      - name: Unit tests
        run: godot --headless --path . -s res://tests/run_tests.gd
      - name: Gameplay test
        run: godot --headless --path . res://tests/gameplay_test.tscn
      - name: Multiplayer smoke test
        run: GODOT=godot tests/smoke.sh
