name: tests

on:
  push:
  pull_request:

jobs:
  godot:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Server setup script is plain ASCII
        # DigitalOcean silently skips cloud-init user data with non-ASCII characters.
        run: |
          if grep -nP '[^\x00-\x7F]' server/cloud-init.yaml; then echo "::error::server/cloud-init.yaml must be plain ASCII"; exit 1; fi
          python3 -c "import yaml; yaml.safe_load(open('server/cloud-init.yaml'))"
      - name: Download Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
      - name: Import project
        run: godot --headless --path . --import
      - name: Unit tests
        run: timeout 120 godot --headless --path . res://tests/run_tests.tscn
      - name: Gameplay test
        run: timeout 300 godot --headless --path . res://tests/gameplay_test.tscn
      - name: Dedicated server lobby test
        run: timeout 120 godot --headless --path . res://tests/lobby_test.tscn
      - name: Multiplayer smoke test
        run: GODOT=godot timeout 300 tests/smoke.sh
      # 10 game-minutes: long enough that bots reliably steal a crown past spell-casting defenders.
      - name: Bot match soak (25v25, 10 game-minutes, fast-forwarded)
        run: timeout 900 godot --headless --path . --fixed-fps 60 res://tests/bot_soak.tscn -- --minutes 10 --bots 25
