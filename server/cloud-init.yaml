#cloud-config
# Paste this into "User data" / "Cloud config" when creating an Ubuntu or Debian VPS
# (Hetzner, DigitalOcean, Vultr, Linode, AWS…). The server installs itself on first boot
# and runs the latest Regicide release on UDP port 24565.
package_update: true
packages: [curl, ca-certificates]
runcmd:
  - curl -fsSL -o /root/regicide-server.tar.gz https://github.com/Mootmonthly/Regicide/releases/latest/download/Regicide-server-linux.tar.gz
  - tar -xzf /root/regicide-server.tar.gz -C /root
  - /root/regicide-server/install.sh
