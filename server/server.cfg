; Regicide dedicated server settings. Restart the server after changing them.

[server]

; Shown to players when they join.
name="Regicide server"
motd="Welcome! Steal their crown, defend your own."

; UDP port players connect to. Open/forward this port in your firewall.
port=24565

; Leave empty for an open server, or set one players must type on the main menu.
password=""

; Most human players at once (two teams of 50 = 100).
max_players=100

; Test bots per team (0 = real players only).
bots_per_team=0
